[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "habi12k"
version = "0.1.0"
description = "Read HABI-12K RGB, depth, normals, and camera trajectories"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=12",
    "numpy>=1.24",
    "OpenEXR>=3.3,<4",
]

[tool.setuptools]
packages = ["habi12k"]
